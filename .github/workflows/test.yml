name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Bizap

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better coverage analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Verify dependencies
        run: ./gradlew dependencies --configuration testRuntimeClasspath

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --info
        continue-on-error: false

      - name: Generate test report
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/test-results/testDebugUnitTest/TEST-*.xml ]; then
            echo "✅ Tests executed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Test execution failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            Bizap/app/build/reports/tests/
            Bizap/app/build/test-results/
          retention-days: 14

      - name: Parse test results
        if: always()
        run: |
          # Count test results
          TOTAL_TESTS=$(find app/build/test-results/testDebugUnitTest -name "TEST-*.xml" -exec grep -h "tests=" {} \; | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          FAILURES=$(find app/build/test-results/testDebugUnitTest -name "TEST-*.xml" -exec grep -h "failures=" {} \; | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          ERRORS=$(find app/build/test-results/testDebugUnitTest -name "TEST-*.xml" -exec grep -h "errors=" {} \; | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          SKIPPED=$(find app/build/test-results/testDebugUnitTest -name "TEST-*.xml" -exec grep -h "skipped=" {} \; | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          
          echo "Total Tests: ${TOTAL_TESTS:-0}"
          echo "Failures: ${FAILURES:-0}"
          echo "Errors: ${ERRORS:-0}"
          echo "Skipped: ${SKIPPED:-0}"
          
          # Add to GitHub Step Summary
          echo "### Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests:** ${TOTAL_TESTS:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed:** $((${TOTAL_TESTS:-0} - ${FAILURES:-0} - ${ERRORS:-0}))" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed:** ${FAILURES:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- **Errors:** ${ERRORS:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- **Skipped:** ${SKIPPED:-0}" >> $GITHUB_STEP_SUMMARY

      - name: Build verification
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Bizap/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Test failure notification
        if: failure()
        run: |
          echo "::error::Tests failed. Check the test reports for details."
          exit 1

