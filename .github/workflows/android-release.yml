name: Android Release Build

on:
  # Manual trigger only - for production releases
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Version code (integer)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    
    # Restrict permissions to minimum required
    permissions:
      contents: read  # Read repository contents
      actions: read   # Read workflow artifacts
    
    defaults:
      run:
        working-directory: Bizap

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # SECURITY CHECK: Verify secrets are configured
      - name: Verify signing credentials
        run: |
          echo "🔐 Verifying release signing credentials..."
          
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ ERROR: KEYSTORE_BASE64 secret not configured"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "❌ ERROR: KEYSTORE_PASSWORD secret not configured"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "❌ ERROR: KEY_ALIAS secret not configured"
            exit 1
          fi
          
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "❌ ERROR: KEY_PASSWORD secret not configured"
            exit 1
          fi
          
          echo "✅ All signing credentials verified"

      # SECURITY CHECK: Ensure no dev keystore in repository
      - name: Security check - No dev keystore
        run: |
          echo "🔍 Checking for development keystores..."
          
          if [ -f "../release-key.jks" ]; then
            echo "⚠️  WARNING: Dev keystore exists, but will NOT be used"
            echo "    Production keystore will be used instead"
          fi
          
          echo "✅ Using production keystore from GitHub Secrets"

      # Decode keystore from base64 secret
      - name: Decode keystore
        run: |
          echo "🔑 Decoding production keystore..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          echo "✅ Keystore decoded successfully"

      # BUILD STEP: Create signed release APK
      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: |
          echo "🔨 Building signed release APK..."
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          echo "✅ Release APK built successfully"

      # SECURITY CHECK: Verify APK signature
      - name: Verify APK Signature
        run: |
          echo "🔐 Verifying APK signature..."
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: Release APK not found at $APK_PATH"
            exit 1
          fi
          
          # Use apksigner to verify (comes with Android SDK)
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK_PATH"
          
          echo "✅ APK signature verified"

      # Run tests before publishing
      - name: Run unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      # Upload APK as artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ inputs.version_name }}
          path: Bizap/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # Upload test reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: Bizap/app/build/reports/tests/
          retention-days: 30

      # Clean up keystore
      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up temporary keystore..."
          rm -f /tmp/release.keystore
          echo "✅ Cleanup complete"

      # Build summary
      - name: Build summary
        if: success()
        run: |
          echo "## 🎉 Release Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.version_name }} (code ${{ inputs.version_code }})" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** app-release-v${{ inputs.version_name }}.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download APK from Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Test on multiple devices" >> $GITHUB_STEP_SUMMARY
          echo "3. Upload to Google Play Console" >> $GITHUB_STEP_SUMMARY

      # Slack notification on success
      - name: 🔔 Notify Slack on success
        if: success() && secrets.SLACK_WEBHOOK != ''
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"✅ Release build succeeded: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.repository }}> v${{ inputs.version_name }}\"}"

      # Failure notification
      - name: Build failure notification
        if: failure()
        run: |
          echo "## ❌ Release Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common issues:**" >> $GITHUB_STEP_SUMMARY
          echo "- Missing or incorrect signing credentials" >> $GITHUB_STEP_SUMMARY
          echo "- Test failures" >> $GITHUB_STEP_SUMMARY
          echo "- Compilation errors" >> $GITHUB_STEP_SUMMARY

      # Slack notification on failure
      - name: 🔔 Notify Slack on failure
        if: failure() && secrets.SLACK_WEBHOOK != ''
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"❌ Release build failed: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.repository }}> v${{ inputs.version_name }}\"}"

