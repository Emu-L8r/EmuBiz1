detekt:
  # Build upon the official detekt defaults
  buildUponDefaultConfig: true
  # Treat detekt warnings as build failures
  allRules: false

config:
  excludes:
    - '**/test/**'
    - '**/androidTest/**'
    - '**/debug/**'

output-reports:
  active: true

complexity:
  MethodLength:
    active: true
    threshold: 60
  CyclomaticComplexity:
    active: true
    threshold: 15
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInObjects: 12
    thresholdInInterfaces: 10

naming:
  FunctionNaming:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
    functionPattern: '[a-z][a-zA-Z0-9]*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'

style:
  UnusedPrivateMember:
    active: true
  MagicNumber:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100'
      - '1000'
  ReturnCount:
    active: true
    max: 4

performance:
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true

potential-bugs:
  LateinitUsage:
    active: false   # Hilt @Inject lateinit is acceptable
  NullableToStringCall:
    active: true
