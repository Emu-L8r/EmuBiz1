# Detekt Configuration - Cleaned for Detekt 1.23.x
# See: https://detekt.dev/configurations.html

detekt:
  buildUponDefaultConfig: true
  allRules: false

exclude:
  - '**/test/**'
  - '**/androidTest/**'
  - '**/debug/**'
  - '**/build/**'

complexity:
  MethodLength:
    active: true
    threshold: 60
  CyclomaticComplexity:
    active: true
    threshold: 15
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInObjects: 12
    thresholdInInterfaces: 10

naming:
  FunctionNaming:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
  VariableNaming:
    active: true

style:
  UnusedPrivateMember:
    active: true
  MagicNumber:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100'
      - '1000'
  ReturnCount:
    active: true
    max: 4

performance:
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true

potential-bugs:
  LateinitUsage:
    active: false
  NullableToStringCall:
    active: true
