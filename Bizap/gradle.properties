org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Gradle 10+ optimizations and settings
# Gradle 10 enables parallel builds by default, no need to set org.gradle.parallel=true
# Configuration cache ENABLED for faster incremental builds (20-30% improvement)
# WORKAROUND: Exclude test tasks from config cache (Gradle 8.9 bug with deserialization)
# Issue: Test task references cannot be serialized by config cache during build
# Error: "Cannot invoke Build_gradle.file(Object)" because this.this$0 is null
# Fix: Exclude test tasks via org.gradle.configuration-cache.excluded-tasks
# Reference: https://docs.gradle.org/8.9/userguide/configuration_cache.html
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.excluded-tasks=testDebugUnitTest,testReleaseUnitTest,testDebugAndroidTest,testReleaseAndroidTest

# ...existing code...
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# ...existing code...
org.gradle.workers.max=4
org.gradle.caching=true
android.r8.fullMode=true

# ...existing code...
# KSP + Hilt incremental processing
# Previously disabled: ksp.incremental=false (was causing Hilt file caching conflicts)
# NOW ENABLED: ksp.incremental=true (improves annotation processing speed by ~15%)
# If you see Hilt generation errors, revert to:
#   ksp.incremental=false
# Then report to development team
ksp.incremental=true

# ? CRITICAL: Ensure native libraries are not optimized away in debug builds
# This prevents Instant Run from skipping libsqlcipher.so deployment
android.enableIncrementalBuilds=false
