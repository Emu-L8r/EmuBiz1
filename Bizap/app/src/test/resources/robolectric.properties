# Robolectric Configuration for Windows Compatibility
# See: http://robolectric.org/configuration/

# Use offline mode to avoid network issues and use pre-downloaded artifacts
robolectric.offline=true

# Use Maven Central for dependency resolution
robolectric.dependency.repo.id=central

# Enable SDK to use more compatible mode
robolectric.strictI18n=false

# Use Java temp directory which handles POSIX better on Windows
# This prevents "UnsupportedOperationException: POSIX file permissions" errors
robolectric.useSystemProperties=true

# Disable strictI18n to avoid issues with locale handling
# Enable offline to use cached JARs instead of downloading them every time
robolectric.mode=legacy

# Use legacy resources mode to avoid POSIX permission errors
robolectric.resourcesMode=legacy

# Target API level 28 (Android 9)
robolectric.sdk=28

# Disable logging noise during tests
robolectric.logging.enabled=false
