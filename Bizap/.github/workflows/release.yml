name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 📝 Make gradlew executable
      run: chmod +x gradlew

    - name: 🔨 Build release APK
      run: ./gradlew clean assembleRelease --stacktrace

    - name: 📦 Build release bundle
      run: ./gradlew bundleRelease --stacktrace

    - name: 📊 Run all tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: 📤 Upload release APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/
        retention-days: 90

    - name: 📤 Upload release bundle
      uses: actions/upload-artifact@v3
      with:
        name: app-release-bundle
        path: app/build/outputs/bundle/release/
        retention-days: 90

    - name: 📋 Create release notes
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        echo "Release: $TAG_NAME" > release-notes.txt
        echo "Build Date: $(date)" >> release-notes.txt
        echo "Commit: ${{ github.sha }}" >> release-notes.txt

    - name: 🎉 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab
          release-notes.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 📈 Release Summary
      if: always()
      run: |
        echo "## 🎉 Release Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "**Release APK:** Generated" >> $GITHUB_STEP_SUMMARY
        echo "**Release Bundle:** Generated" >> $GITHUB_STEP_SUMMARY
        echo "**Tests:** All passed" >> $GITHUB_STEP_SUMMARY
        echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref }})" >> $GITHUB_STEP_SUMMARY

