name: Matrix Effects Regression Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/src/main/java/com/emul8r/bizap/ui/gui3/**'
      - 'app/src/test/java/**/MatrixTest.kt'
      - 'app/src/test/java/**/EffectTest.kt'
      - '.github/workflows/matrix-effects-regression.yml'
  pull_request:
    branches: [main, develop]

jobs:
  compile:
    name: Compile & Effect Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Run Matrix effect tests
        run: ./gradlew test -k "Matrix" --no-daemon
        continue-on-error: false

      - name: Validate effect implementations
        run: |
          echo "=== Checking Effect Files ==="
          test -f app/src/main/java/com/emul8r/bizap/ui/gui3/components/effects/RainParticleEffect.kt && echo "✓ RainParticleEffect.kt" || (echo "✗ RainParticleEffect.kt missing"; exit 1)
          test -f app/src/main/java/com/emul8r/bizap/ui/gui3/components/effects/GlitchEffect.kt && echo "✓ GlitchEffect.kt" || (echo "✗ GlitchEffect.kt missing"; exit 1)
          test -f app/src/main/java/com/emul8r/bizap/ui/gui3/components/effects/ScanlineEffect.kt && echo "✓ ScanlineEffect.kt" || (echo "✗ ScanlineEffect.kt missing"; exit 1)
          test -f app/src/main/java/com/emul8r/bizap/ui/gui3/components/effects/MatrixEffectsPipeline.kt && echo "✓ MatrixEffectsPipeline.kt" || (echo "✗ MatrixEffectsPipeline.kt missing"; exit 1)
          echo "=== All Effect Files Present ==="

      - name: Check build output
        run: |
          echo "=== Build Verification ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk 2>/dev/null && echo "✓ Debug APK created" || echo "⚠ APK not in expected location"

  lint:
    name: Kotlin Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --no-daemon
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run all unit tests
        run: ./gradlew test --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: app/build/reports/tests/

  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
      - name: Check APK size
        run: |
          SIZE=$(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')
          echo "✓ APK Size: $SIZE"
          if [ $(stat -f%z app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || stat -c%s app/build/outputs/apk/debug/app-debug.apk) -gt 60000000 ]; then
            echo "⚠ Warning: APK size > 60MB"
          fi

  performance-check:
    name: Performance Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run performance tests
        run: ./gradlew test -k "Performance" --no-daemon
        continue-on-error: true
      - name: Generate performance report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: app/build/reports/

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [compile, unit-tests, build-apk]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.compile.result }}" = "success" ] && [ "${{ needs.unit-tests.result }}" = "success" ] && [ "${{ needs.build-apk.result }}" = "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed"
            exit 1
          fi

