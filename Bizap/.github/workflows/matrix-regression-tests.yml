name: Matrix Background Regression Tests

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/emul8r/bizap/ui/gui3/**'
      - 'app/src/test/java/com/emul8r/bizap/ui/gui3/**'
      - 'docs/MATRIX_*.md'
      - '.github/workflows/matrix-regression*.yml'
  push:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/emul8r/bizap/ui/gui3/**'

jobs:
  unit-tests:
    name: Unit Tests (Fast — ~2 min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Matrix Unit Tests
        run: ./gradlew test -k "Matrix"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: build/test-results/

  effect-checklist:
    name: Effect Maturity Checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Validate Effect Implementation
        run: |
          # Check that all effect files have required markers
          echo "🔍 Validating Matrix effects..."

          # Find all effect files
          for effect_file in app/src/main/java/com/emul8r/bizap/ui/gui3/components/effects/*Effect.kt; do
            if [ ! -f "$effect_file" ]; then
              continue
            fi

            effect_name=$(basename "$effect_file")
            echo ""
            echo "Checking: $effect_name"

            # Check for KDoc
            if ! grep -q "/**" "$effect_file"; then
              echo "  ❌ Missing KDoc comments"
              exit 1
            fi

            # Check for MatrixEffect implementation
            if ! grep -q "MatrixEffect" "$effect_file"; then
              echo "  ❌ Does not implement MatrixEffect"
              exit 1
            fi

            # Check for error handling (try-catch)
            if ! grep -q "try {" "$effect_file"; then
              echo "  ❌ Missing error handling (try-catch)"
              exit 1
            fi

            echo "  ✅ Passes maturity checklist"
          done

          echo ""
          echo "✅ All effects pass maturity checklist"

  build-test:
    name: Build & Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (GUI3 only)
        run: ./gradlew assembleDebug

      - name: Upload Build Artifact (for manual testing)
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  lint-and-style:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Detekt (static analysis)
        run: ./gradlew detekt
        continue-on-error: true

      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: detekt-report
          path: build/reports/detekt/

  # Future: Screenshot regression tests (requires Paparazzi setup)
  # screenshot-tests:
  #   name: Screenshot Regression Tests
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v3
  #     - name: Run Paparazzi Screenshots
  #       run: ./gradlew verifyPaparazziDebug
  #     - name: Upload Screenshot Diffs
  #       if: failure()
  #       uses: actions/upload-artifact@v3
  #       with:
  #         name: screenshot-diffs
  #         path: build/paparazzi/

  gui-compatibility:
    name: GUI Compatibility Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Verify GUI1/GUI2/GUI3 Independence
        run: |
          echo "🔍 Checking GUI decoupling..."

          # GUI3 changes should not affect GUI1/GUI2
          if git diff HEAD~1 --name-only | grep -q "ui/gui3"; then
            echo "Files changed in ui/gui3 (expected for this PR)"

            # Verify no GUI1/GUI2 imports of GUI3
            if grep -r "ui.gui3" app/src/main/java/com/emul8r/bizap/ui/gui1 2>/dev/null; then
              echo "  ❌ GUI1 imports GUI3 (breaks separation)"
              exit 1
            fi

            if grep -r "ui.gui3" app/src/main/java/com/emul8r/bizap/ui/gui2 2>/dev/null; then
              echo "  ❌ GUI2 imports GUI3 (breaks separation)"
              exit 1
            fi
          fi

          echo "  ✅ GUI3 changes do not affect GUI1/GUI2"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, effect-checklist, build-test, lint-and-style, gui-compatibility]
    if: always()
    steps:
      - name: Report Results
        run: |
          echo "╔════ MATRIX REGRESSION TEST SUMMARY ════╗"
          echo "║ Unit Tests: ${{ needs.unit-tests.result }}"
          echo "║ Effect Checklist: ${{ needs.effect-checklist.result }}"
          echo "║ Build: ${{ needs.build-test.result }}"
          echo "║ Lint: ${{ needs.lint-and-style.result }}"
          echo "║ GUI Compatibility: ${{ needs.gui-compatibility.result }}"
          echo "╚════════════════════════════════════════╝"

          if [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.effect-checklist.result }}" = "failure" ] || \
             [ "${{ needs.build-test.result }}" = "failure" ] || \
             [ "${{ needs.gui-compatibility.result }}" = "failure" ]; then
            echo ""
            echo "❌ CI FAILED - Please review errors above"
            exit 1
          fi

          echo ""
          echo "✅ CI PASSED - Ready to merge"

