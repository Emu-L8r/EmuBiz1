name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 📝 Make gradlew executable
      run: chmod +x gradlew

    - name: 🧹 Lint check
      run: ./gradlew lint --continue
      continue-on-error: true

    - name: 🔨 Build with Gradle
      run: ./gradlew clean build --stacktrace

    - name: ✅ Run unit tests
      run: ./gradlew testDebugUnitTest --stacktrace
      continue-on-error: false

    - name: 📊 Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: app/build/test-results/testDebugUnitTest/*.xml
        check_name: Unit Test Results
        compare_to_earlier_commit: true

    - name: 📦 Upload APK artifact
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: 📋 Upload test reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports
        path: app/build/reports/
        retention-days: 30

    - name: 📈 Test Summary
      if: always()
      run: |
        echo "## ✅ Build & Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Java Version:** 17" >> $GITHUB_STEP_SUMMARY
        echo "**Gradle Cache:** enabled" >> $GITHUB_STEP_SUMMARY
        if [ -f app/build/reports/androidTests/connected/index.html ]; then
          echo "**Test Report:** Available" >> $GITHUB_STEP_SUMMARY
        fi

  security-check:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Run security checks
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: 📤 Upload security results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

